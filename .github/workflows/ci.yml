name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package without evidence extras
        # Deliberately no [evidence] extra: this is what proves the package imports and
        # runs with nothing but numpy, pandas, scikit-learn and scipy installed.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff

      - name: Import without the extras present
        # A heavy optional dependency on the build machine can mask a broken import. This
        # fails immediately if anything in the package reaches for an evidence-only import.
        run: python -c "import backtest_leakage, backtest_leakage.cli, backtest_leakage.gap; print('import ok')"

      - name: Lint
        run: ruff check src tests tools experiments

      - name: Test
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/junit.xml \
            --cov=backtest_leakage --cov-report=json:coverage.json --cov-report=xml:coverage.xml

      - name: Coverage floor
        run: |
          python - <<'PY'
          import json, sys
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          print(f"line coverage {pct:.1f}%")
          sys.exit(0 if pct >= 100.0 else 1)
          PY

      - name: Receipts (re-measure and verify every published number)
        run: |
          python tools/collect_metrics.py --skip-tests
          python tools/check_numbers.py

      - name: Publish the awkward table to the job summary
        if: always()
        run: python tools/awkward_table.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiments-${{ matrix.python-version }}
          path: docs/experiments/*.json
