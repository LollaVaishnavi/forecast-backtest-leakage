[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-leakage"
version = "0.1.0"
description = "Run a forecasting pipeline through k-fold CV and a time-ordered walk-forward backtest, and report the leakage gap between them."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vaishnavi Lolla" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Dev-time evidence tooling only. CI runs the core install without these,
# which is what proves the package imports with no heavy extras present.
evidence = [
    "cmarkgfm>=2024.1.14",
    "playwright>=1.40",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
btleak = "backtest_leakage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
